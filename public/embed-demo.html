<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>网页客服嵌入演示</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="content">
      <section class="panel">
        <h1>网页客服嵌入演示</h1>
        <p>本页加载平台的实际悬浮客服入口，点击按钮即可开始咨询。</p>
        <p class="small">
          标题、欢迎语、主题和按钮位置取自已保存的平台配置。停用的平台不会接收新咨询。
        </p>
        <div class="service-form-grid">
          <label
            >宿主语言 / Host language<select id="host-language">
              <option value="zh-CN">简体中文</option>
              <option value="en">English</option>
            </select></label
          ><label
            >宿主主题 / Host theme<select id="host-theme">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select></label
          >
        </div>
      </section>
    </main>
    <script src="/embed-demo.js"></script>
  </body>
</html>
